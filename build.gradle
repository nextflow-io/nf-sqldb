import java.nio.file.FileSystems
import java.nio.file.Path
import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream
import org.gradle.api.artifacts.transform.TransformParameters

plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.16'
    id 'maven-publish'
    id 'de.undercouch.download' version '5.6.0'
}

group = 'io.nextflow'
version = project.file('VERSION').text.trim()

nextflowPlugin {
    nextflowVersion = '26.04.0'

    provider = 'nextflow'
    className = 'nextflow.sql.SqlPlugin'
    extensionPoints = [
        'nextflow.sql.ChannelSqlExtension',
        'nextflow.sql.config.SqlConfig'
    ]
}

// retain method parameter names in the plugin spec (remove once the Gradle plugin does this)
tasks.withType(GroovyCompile).configureEach {
    groovyOptions.parameters = true
}

configurations {
    runtimeClasspath.exclude group: 'org.slf4j', module: 'slf4j-api'
}

// AWS Athena JDBC driver is not on Maven Central, so it is downloaded and verified at build time
// https://docs.aws.amazon.com/athena/latest/ug/connect-with-jdbc.html
def athenaVersion = '2.0.25.1001'
def athenaZip = layout.buildDirectory.file("downloads/SimbaAthenaJDBC-${athenaVersion}.zip")
def athenaJar = layout.buildDirectory.file("downloads/athena/AthenaJDBC42_${athenaVersion}.jar")

tasks.register('downloadAthenaDriver', Download) {
    src "https://s3.amazonaws.com/athena-downloads/drivers/JDBC/SimbaAthenaJDBC-${athenaVersion}/SimbaAthenaJDBC-${athenaVersion}.zip"
    dest athenaZip
    overwrite false
}

tasks.register('verifyAthenaDriver', Verify) {
    dependsOn 'downloadAthenaDriver'
    src athenaZip
    algorithm 'MD5'
    checksum '71504d0317656d790978363358d0c068'
}

tasks.register('extractAthenaDriver', Copy) {
    dependsOn 'verifyAthenaDriver'
    from(zipTree(athenaZip)) {
        include "SimbaAthenaJDBC-${athenaVersion}/AthenaJDBC42_${athenaVersion}.jar"
        eachFile { path = name }
        includeEmptyDirs = false
    }
    into athenaJar.map { it.asFile.parentFile }
}

// Nextflow doesn't run natively on Windows, so the Windows native libraries are stripped
// from the bundled JDBC drivers to keep the plugin zip under the registry size limit
abstract class StripWindowsNatives implements TransformAction<TransformParameters.None> {
    static final Map<String,String> PATTERNS = [
        'duckdb_jdbc-': 'libduckdb_java.so_windows_*',
        'sqlite-jdbc-': 'org/sqlite/native/Windows/**',
    ]

    @InputArtifact
    abstract Provider<FileSystemLocation> getInputArtifact()

    @Override
    void transform(TransformOutputs outputs) {
        final input = inputArtifact.get().asFile
        final pattern = PATTERNS.find { prefix, glob -> input.name.startsWith(prefix) }?.value
        if( !pattern ) {
            outputs.file(inputArtifact)
            return
        }
        final matcher = FileSystems.default.getPathMatcher("glob:${pattern}")
        int stripped = 0
        new ZipFile(input).withCloseable { zip ->
            new ZipOutputStream(outputs.file(input.name).newOutputStream()).withCloseable { out ->
                for( final entry : zip.entries() ) {
                    if( matcher.matches(Path.of(entry.name)) ) {
                        stripped++
                        continue
                    }
                    final copy = new ZipEntry(entry.name)
                    copy.time = entry.time
                    out.putNextEntry(copy)
                    out << zip.getInputStream(entry)
                    out.closeEntry()
                }
            }
        }
        if( !stripped )
            throw new GradleException("No entries matching '${pattern}' in ${input.name} -- update the patterns in build.gradle")
    }
}

def windowsStripped = Attribute.of('io.nextflow.windowsStripped', Boolean)

dependencies {
    attributesSchema { attribute(windowsStripped) }
    artifactTypes.getByName('jar').attributes.attribute(windowsStripped, false)
    registerTransform(StripWindowsNatives) {
        from.attribute(windowsStripped, false)
        to.attribute(windowsStripped, true)
    }
}

// the plugin zip bundles the runtime classpath into lib/
configurations.runtimeClasspath.attributes.attribute(windowsStripped, true)

dependencies {
    compileOnly 'org.slf4j:slf4j-api:2.0.16'
    compileOnly 'org.pf4j:pf4j:3.12.0'

    api('org.apache.groovy:groovy-sql:4.0.26') { transitive = false }
    api 'com.h2database:h2:1.4.200'
    api 'mysql:mysql-connector-java:8.0.33'
    api 'org.mariadb.jdbc:mariadb-java-client:2.7.0'
    api 'org.postgresql:postgresql:42.7.5'
    api 'org.xerial:sqlite-jdbc:3.49.1.0'
    api 'org.duckdb:duckdb_jdbc:1.3.0.0'
    api files(athenaJar) { builtBy 'extractAthenaDriver' }

    testImplementation 'org.apache.groovy:groovy-nio:4.0.26'
    testImplementation('org.apache.groovy:groovy-test:4.0.26') { exclude group: 'org.apache.groovy' }
}

// Publish the plugin jar to the Seqera Maven repository (used by nf-databricks, nf-trino, etc.)
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = project.findProperty('publish_repo_url') ?: System.getenv('PUBLISH_REPO_URL') ?: (version.endsWith('-SNAPSHOT') ? 's3://maven.seqera.io/snapshots' : 's3://maven.seqera.io/releases')
            credentials(AwsCredentials) {
                accessKey = project.findProperty('aws_access_key_id') ?: System.getenv('AWS_ACCESS_KEY_ID')
                secretKey = project.findProperty('aws_secret_access_key') ?: System.getenv('AWS_SECRET_ACCESS_KEY')
                sessionToken = System.getenv('AWS_SESSION_TOKEN')
            }
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

test {
    systemProperty 'pluginVersion', version
}

// Integration tests against real databases (requires Docker), not part of `check`
sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    integrationTestImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
    integrationTestImplementation 'org.testcontainers:testcontainers-mysql:2.0.5'
}

// same as compileTestGroovy: the Nextflow plugin writes the extension index and spec into the main resources
tasks.named('compileIntegrationTestGroovy') {
    dependsOn 'extensionPoints', 'generateSpec'
}

tasks.register('integrationTest', Test) {
    description = 'Runs the integration tests against real databases (requires Docker).'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.test
}
